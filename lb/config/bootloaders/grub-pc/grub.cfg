source /boot/grub/config.cfg

# Default: manual mode in English. AUTO is never the default entry.
set default=0
set timeout=10

menuentry "ShamanWipe — English — manual mode (recommended)" --hotkey=e {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=en locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC
	initrd	@INITRD_LIVE@
}

menuentry "ShamanWipe — polski — tryb ręczny (zalecany)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=pl locales=pl_PL.UTF-8 keyboard-layouts=pl timezone=Europe/Warsaw
	initrd	@INITRD_LIVE@
}

menuentry "English — inventory and SMART only (erases nothing)" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=en locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC sw.mode=inventory
	initrd	@INITRD_LIVE@
}

menuentry "Polski — tylko inwentarz i SMART (niczego nie kasuje)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=pl locales=pl_PL.UTF-8 keyboard-layouts=pl timezone=Europe/Warsaw sw.mode=inventory
	initrd	@INITRD_LIVE@
}

submenu "AUTO — erases ALL disks without asking / kasuje WSZYSTKIE dyski ..." --hotkey=a {
	source /boot/grub/theme.cfg
	menuentry "Back / Wróć" {
		configfile /boot/grub/grub.cfg
	}
	menuentry "English: AUTO standard — Purge where possible, else overwrite (60 s)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=en locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC sw.auto=standard
		initrd	@INITRD_LIVE@
	}
	menuentry "English: AUTO standard + power off when done" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=en locales=en_US.UTF-8 keyboard-layouts=us timezone=Etc/UTC sw.auto=standard sw.after=poweroff
		initrd	@INITRD_LIVE@
	}
	menuentry "Polski: AUTOMAT standard — Purge gdzie się da, inaczej nadpis (60 s)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=pl locales=pl_PL.UTF-8 keyboard-layouts=pl timezone=Europe/Warsaw sw.auto=standard
		initrd	@INITRD_LIVE@
	}
	menuentry "Polski: AUTOMAT standard + wyłącz komputer po zakończeniu" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ sw.lang=pl locales=pl_PL.UTF-8 keyboard-layouts=pl timezone=Europe/Warsaw sw.auto=standard sw.after=poweroff
		initrd	@INITRD_LIVE@
	}
}

submenu "Tools / Narzędzia ..." --hotkey=t {
	source /boot/grub/theme.cfg
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI firmware settings / Ustawienia firmware UEFI" --hotkey=f {
			fwsetup
		}
	fi
	menuentry "Verify medium checksums / Sprawdź sumy kontrolne nośnika" --hotkey=v {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
}
